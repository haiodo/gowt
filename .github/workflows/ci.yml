name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

# Three workers: Linux runs every Linux and repository-wide gate; Windows and macOS each run their
# native build, unit and GUI checks. Gates within a worker share checkout, toolchain and Docker image.
jobs:
  native:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test process diagnostics
        shell: bash
        run: |
          exe="$(pwd -W 2>/dev/null || pwd)/testexec.exe"
          go build -o "$exe" ./tooling/testexec
          echo "GOFLAGS='-exec=\"$exe\"'" >> "$GITHUB_ENV"
      - name: Build and vet amd64 and arm64
        shell: bash
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch go build ./... || exit 1
            GOARCH=$arch go vet ./... || exit 1
          done
      # No GOWT_GUI_TEST yet: tests that open windows skip themselves here.
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-logs
          go test -v -count=1 -timeout 20m ./... 2>&1 | tee test-logs/native.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-logs-${{ matrix.os }}
          path: test-logs
          if-no-files-found: ignore
      - name: Windows crash dumps
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dumpFolder = Join-Path $env:GITHUB_WORKSPACE 'gui-artifacts/crash'
          New-Item -ItemType Directory -Path $dumpFolder -Force | Out-Null
          $procdumpFolder = Join-Path $env:RUNNER_TEMP 'procdump'
          New-Item -ItemType Directory -Path $procdumpFolder -Force | Out-Null
          $archive = Join-Path $procdumpFolder 'Procdump.zip'
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Procdump.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $procdumpFolder -Force
          $procdump = (Get-Item (Join-Path $procdumpFolder 'procdump64.exe')).FullName
          "GOWT_PROCDUMP=$procdump" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GOWT_CRASH_DIR=$dumpFolder" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpFolder -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 5 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          & {
            Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
            Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion, CurrentHorizontalResolution, CurrentVerticalResolution, CurrentRefreshRate | Format-List
            Add-Type -AssemblyName System.Windows.Forms
            [System.Windows.Forms.Screen]::AllScreens | Format-List DeviceName, Bounds, WorkingArea, Primary, BitsPerPixel
            Get-ItemProperty 'HKCU:\Control Panel\Desktop' | Select-Object LogPixels, Win8DpiScaling | Format-List
          } | Out-File -FilePath (Join-Path $dumpFolder 'runner-settings.txt') -Encoding utf8
      - name: Runner settings the GUI tests depend on
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        run: |
          sw_vers
          for k in "-g AppleShowScrollBars" "-g AppleKeyboardUIMode" "-g AppleInterfaceStyle" \
            "com.apple.universalaccess reduceTransparency" "com.apple.universalaccess increaseContrast"; do
            # shellcheck disable=SC2086
            echo "$k: $(defaults read $k 2>&1)"
          done
          system_profiler SPDisplaysDataType | grep -E 'Chipset|Metal|Resolution' || true
      - name: GUI test settings and artifact directories
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          art="$(pwd -W 2>/dev/null || pwd)/gui-artifacts"
          {
            echo "GOWT_QA_ARTIFACTS=$art/qa"
            echo "GOWT_PIXELS_DIR=$art/pixels"
            echo "GOWT_TEST_SHOTS=$art/shots"
            echo "GOWT_GUI_TEST=1"
            echo "GOWT_SHOT_TRACE=1"
            echo "GOWT_TRACE_LIFECYCLE=1"
            echo "GOTRACEBACK=system"
          } >> "$GITHUB_ENV"
          mkdir -p "$art/qa" "$art/pixels" "$art/shots"
      # Packages with GUI tests run serially because they share the desktop and focus.
      - name: Packages with GOWT_GUI_TEST tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p gui-artifacts/logs
          pkgs=$(git ls-files '*_test.go' | xargs grep -l GOWT_GUI_TEST | xargs -n1 dirname | sort -u | sed 's|^|./|' |
            xargs go list -e -f '{{if or .GoFiles .CgoFiles .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}')
          echo "$pkgs"
          # shellcheck disable=SC2086
          go test -count=1 -p 1 -v -timeout 25m $pkgs 2>&1 | tee gui-artifacts/logs/packages.log
      - name: QA tree focus
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p gui-artifacts/logs
          go test -v -count=1 -tags gowtqa -run 'TestQATreeFocus' . 2>&1 | tee gui-artifacts/logs/tree-focus.log
      - name: QA sidebar and inspector focus
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p gui-artifacts/logs
          go test -v -count=1 -tags gowtqa -run '^(TestSidebarFocus|TestInspectorFocus)$' ./look 2>&1 | tee gui-artifacts/logs/sidebar-inspector-focus.log
      - name: Windows crash events
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $crashFolder = Join-Path $env:GITHUB_WORKSPACE 'gui-artifacts/crash'
          New-Item -ItemType Directory -Path $crashFolder -Force | Out-Null
          Get-ChildItem -Path $crashFolder -Recurse -File | Select-Object FullName, Length, LastWriteTimeUtc |
            Format-Table -AutoSize | Out-String -Width 4096 | Tee-Object -FilePath "$crashFolder/dump-summary.txt"
          wevtutil epl Application "$crashFolder/application-errors.evtx" /q:"*[System[Provider[@Name='Application Error'] or Provider[@Name='Windows Error Reporting']]]" /ow:true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wevtutil qe Application /q:"*[System[Provider[@Name='Application Error'] or Provider[@Name='Windows Error Reporting']]]" /f:xml |
            Out-File -FilePath "$crashFolder/application-errors.xml" -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The crash reports of macOS name an uncaught Objective-C exception and its reason.
      - name: Crash reports
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p gui-artifacts/crash
          cp ~/Library/Logs/DiagnosticReports/*.ips gui-artifacts/crash/ 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gui-artifacts-${{ matrix.os }}
          path: gui-artifacts
          if-no-files-found: ignore

  linux:
    name: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and vet amd64 and arm64
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch go build ./... || exit 1
            GOARCH=$arch go vet ./... || exit 1
          done
      - name: xcheck, api-check, licence-check, docs-counts and map-check
        run: make xcheck api-check licence-check docs-counts map-check
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: tooling/j2go/pom.xml
      - name: Read upstream pins
        run: grep -E '^[A-Z_]+=' tooling/source-pins.env >> "$GITHUB_ENV"
      - name: Cache upstream sources
        id: upstream
        uses: actions/cache@v6
        with:
          path: ~/upstream
          key: upstream-${{ env.SWT_SHA }}-${{ env.UI_SHA }}
      - name: Fetch upstream sources
        if: steps.upstream.outputs.cache-hit != 'true'
        run: |
          fetch() { # name url sha
            git init -q "$HOME/upstream/$1"
            git -C "$HOME/upstream/$1" fetch -q --depth 1 "$2" "$3"
            git -C "$HOME/upstream/$1" checkout -q FETCH_HEAD
          }
          fetch eclipse.platform.swt https://github.com/eclipse-platform/eclipse.platform.swt.git "$SWT_SHA"
          fetch eclipse.platform.ui https://github.com/eclipse-platform/eclipse.platform.ui.git "$UI_SHA"
      - name: gen-check
        run: SWT_REPO="$HOME/upstream/eclipse.platform.swt" UI_REPO="$HOME/upstream/eclipse.platform.ui" make gen-check
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: tooling/linux
          tags: gowt-linux:ci
          load: true
          cache-from: type=gha,scope=gowt-linux
          cache-to: type=gha,scope=gowt-linux,mode=max
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/gowt-gocache
            ~/.cache/gowt-gomod
          key: linux-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            linux-go-${{ hashFiles('go.sum') }}-
      # stand.sh starts Xvfb :99. Every gate uses the same image and continues after an earlier gate failure.
      - name: linux swt tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p test-logs ~/.cache/gowt-gocache ~/.cache/gowt-gomod
          docker run --rm -v "$PWD":/src -v ~/.cache/gowt-gocache:/gocache -v ~/.cache/gowt-gomod:/gomod \
            gowt-linux:ci stand.sh sh -c 'cd /src && go build -o /tmp/testexec ./tooling/testexec && export GOFLAGS="$GOFLAGS -exec=/tmp/testexec" GOWT_TRACE_LIFECYCLE=1 GOTRACEBACK=system && go build -o /tmp/swttest ./cmd/swttest && /tmp/swttest -expected tests/expected_linux.txt' 2>&1 | tee test-logs/swt.log
      - name: linux jface tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p test-logs ~/.cache/gowt-gocache ~/.cache/gowt-gomod
          docker run --rm -v "$PWD":/src -v ~/.cache/gowt-gocache:/gocache -v ~/.cache/gowt-gomod:/gomod \
            gowt-linux:ci stand.sh sh -c 'cd /src && go build -o /tmp/testexec ./tooling/testexec && export GOFLAGS="$GOFLAGS -exec=/tmp/testexec" GOWT_TRACE_LIFECYCLE=1 GOTRACEBACK=system && go build -tags jface -o /tmp/jfacetest ./cmd/swttest && /tmp/jfacetest -expected tests/expected_jface_linux.txt' 2>&1 | tee test-logs/jface.log
      - name: linux unit tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p test-logs ~/.cache/gowt-gocache ~/.cache/gowt-gomod
          docker run --rm -v "$PWD":/src -v ~/.cache/gowt-gocache:/gocache -v ~/.cache/gowt-gomod:/gomod \
            gowt-linux:ci stand.sh sh -c 'cd /src && go build -o /tmp/testexec ./tooling/testexec && export GOFLAGS="$GOFLAGS -exec=/tmp/testexec" GOWT_TRACE_LIFECYCLE=1 GOTRACEBACK=system && go test -v -count=1 ./...' 2>&1 | tee test-logs/unit.log
      - name: linux gui tests
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p test-logs ~/.cache/gowt-gocache ~/.cache/gowt-gomod
          docker run --rm -v "$PWD":/src -v ~/.cache/gowt-gocache:/gocache -v ~/.cache/gowt-gomod:/gomod \
            gowt-linux:ci stand.sh sh -c 'cd /src && go build -o /tmp/testexec ./tooling/testexec && export GOFLAGS="$GOFLAGS -exec=/tmp/testexec" GOWT_TRACE_LIFECYCLE=1 GOTRACEBACK=system && GOWT_GUI_TEST=1 go test -v -count=1 -p 1 $(make -s check-gui-list)' 2>&1 | tee test-logs/gui.log
      - name: linux qa tree focus
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p test-logs ~/.cache/gowt-gocache ~/.cache/gowt-gomod
          docker run --rm -v "$PWD":/src -v ~/.cache/gowt-gocache:/gocache -v ~/.cache/gowt-gomod:/gomod \
            gowt-linux:ci stand.sh sh -c 'cd /src && go build -o /tmp/testexec ./tooling/testexec && export GOFLAGS="$GOFLAGS -exec=/tmp/testexec" GOWT_TRACE_LIFECYCLE=1 GOTRACEBACK=system && GOWT_GUI_TEST=1 go test -v -count=1 -tags gowtqa -run TestQATreeFocus .' 2>&1 | tee test-logs/qa-tree.log
      - name: linux qa sidebar and inspector focus
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p test-logs ~/.cache/gowt-gocache ~/.cache/gowt-gomod
          docker run --rm -v "$PWD":/src -v ~/.cache/gowt-gocache:/gocache -v ~/.cache/gowt-gomod:/gomod \
            gowt-linux:ci stand.sh sh -c 'cd /src && go build -o /tmp/testexec ./tooling/testexec && export GOFLAGS="$GOFLAGS -exec=/tmp/testexec" GOWT_TRACE_LIFECYCLE=1 GOTRACEBACK=system && GOWT_GUI_TEST=1 go test -v -count=1 -tags gowtqa -run "^(TestSidebarFocus|TestInspectorFocus)$" ./look' 2>&1 | tee test-logs/qa-panes.log
      # Developer Certificate of Origin: every commit of a pull request carries a Signed-off-by line.
      - name: DCO sign-off
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $c has no Signed-off-by line: $(git log -1 --format=%s "$c")"
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then
            echo "Add it with git commit -s, or git rebase --signoff $BASE for several commits. See CONTRIBUTING.md." >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-logs-linux
          path: test-logs
          if-no-files-found: ignore
      - name: Return cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/gowt-gocache ~/.cache/gowt-gomod
