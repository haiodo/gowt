name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

# On the Linux runner the GUI gates run in the Docker stand under Xvfb. On the hosted Windows and macOS runners
# the native jobs build, vet and run the non-GUI tests; their required GUI job runs separately.
# The translated SWT and JFace gates run in the Linux stand below.
jobs:
  build-vet:
    name: build and vet ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux, windows]
        goarch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Pure Go (CGO_ENABLED=0), so every target cross-builds on one runner.
      - run: go build ./...
      # vet type-checks the test files too.
      - run: go vet ./...

  # The code was only cross-built for Windows and macOS here, so a crash that exists on windows/amd64 alone went unseen.
  native:
    name: ${{ matrix.os }} build, vet and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test process diagnostics
        shell: bash
        run: |
          exe="$(pwd -W 2>/dev/null || pwd)/testexec.exe"
          go build -o "$exe" ./tooling/testexec
          echo "GOFLAGS='-exec=\"$exe\"'" >> "$GITHUB_ENV"
      - run: go build ./...
      - run: go vet ./...
      # No GOWT_GUI_TEST: the tests that open windows skip themselves.
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-logs
          go test -v -count=1 -timeout 20m ./... 2>&1 | tee test-logs/native.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-logs-${{ matrix.os }}
          path: test-logs
          if-no-files-found: ignore

  # Real windows. Packages with GOWT_GUI_TEST tests run one after another (-p 1), as make check-gui does; bash so
  # that one package list works on both runners (make is not assumed on Windows).
  native-gui:
    name: ${{ matrix.os }} gui tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      GOWT_GUI_TEST: "1"
      GOWT_SHOT_TRACE: "1"
      GOWT_TRACE_LIFECYCLE: "1"
      GOTRACEBACK: system
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test process diagnostics
        shell: bash
        run: |
          exe="$(pwd -W 2>/dev/null || pwd)/testexec.exe"
          go build -o "$exe" ./tooling/testexec
          echo "GOFLAGS='-exec=\"$exe\"'" >> "$GITHUB_ENV"
      - name: Windows crash dumps
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumpFolder = Join-Path $env:GITHUB_WORKSPACE 'gui-artifacts/crash'
          New-Item -ItemType Directory -Path $dumpFolder -Force | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value $dumpFolder -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 5 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
      - name: Runner settings the GUI tests depend on
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sw_vers
          for k in "-g AppleShowScrollBars" "-g AppleKeyboardUIMode" "-g AppleInterfaceStyle" \
            "com.apple.universalaccess reduceTransparency" "com.apple.universalaccess increaseContrast"; do
            # shellcheck disable=SC2086
            echo "$k: $(defaults read $k 2>&1)"
          done
          system_profiler SPDisplaysDataType | grep -E 'Chipset|Metal|Resolution' || true
      - name: GUI artifact directories
        shell: bash
        run: |
          art="$(pwd -W 2>/dev/null || pwd)/gui-artifacts"
          echo "GOWT_QA_ARTIFACTS=$art/qa" >> "$GITHUB_ENV"
          echo "GOWT_PIXELS_DIR=$art/pixels" >> "$GITHUB_ENV"
          echo "GOWT_TEST_SHOTS=$art/shots" >> "$GITHUB_ENV"
          mkdir -p "$art/qa" "$art/pixels" "$art/shots"
      - name: Packages with GOWT_GUI_TEST tests
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p gui-artifacts/logs
          pkgs=$(git ls-files '*_test.go' | xargs grep -l GOWT_GUI_TEST | xargs -n1 dirname | sort -u | sed 's|^|./|' |
            xargs go list -e -f '{{if or .GoFiles .CgoFiles .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}')
          echo "$pkgs"
          # shellcheck disable=SC2086
          go test -count=1 -p 1 -v -timeout 25m $pkgs 2>&1 | tee gui-artifacts/logs/packages.log
      - name: QA tree focus
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p gui-artifacts/logs
          go test -v -count=1 -tags gowtqa -run 'TestQATreeFocus' . 2>&1 | tee gui-artifacts/logs/tree-focus.log
      - name: QA sidebar and inspector focus
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p gui-artifacts/logs
          go test -v -count=1 -tags gowtqa -run '^(TestSidebarFocus|TestInspectorFocus)$' ./look 2>&1 | tee gui-artifacts/logs/sidebar-inspector-focus.log
      - name: Windows crash events
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $crashFolder = Join-Path $env:GITHUB_WORKSPACE 'gui-artifacts/crash'
          New-Item -ItemType Directory -Path $crashFolder -Force | Out-Null
          wevtutil epl Application "$crashFolder/application-errors.evtx" /q:"*[System[Provider[@Name='Application Error'] or Provider[@Name='Windows Error Reporting']]]" /ow:true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The crash reports of macOS name an uncaught Objective-C exception and its reason.
      - name: Crash reports
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p gui-artifacts/crash
          cp ~/Library/Logs/DiagnosticReports/*.ips gui-artifacts/crash/ 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gui-artifacts-${{ matrix.os }}
          path: gui-artifacts
          if-no-files-found: ignore

  checks:
    name: xcheck, api-check, licence-check and docs-counts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: make xcheck api-check licence-check docs-counts

  # Committed swt/, jface/, browser/, tests/ and examples/ equal what make gen produces on all three platforms.
  gen-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: tooling/j2go/pom.xml
      - name: Read upstream pins
        run: grep -E '^[A-Z_]+=' tooling/source-pins.env >> "$GITHUB_ENV"
      - name: Cache upstream sources
        id: upstream
        uses: actions/cache@v6
        with:
          path: ~/upstream
          key: upstream-${{ env.SWT_SHA }}-${{ env.UI_SHA }}
      - name: Fetch upstream sources
        if: steps.upstream.outputs.cache-hit != 'true'
        run: |
          fetch() { # name url sha
            git init -q "$HOME/upstream/$1"
            git -C "$HOME/upstream/$1" fetch -q --depth 1 "$2" "$3"
            git -C "$HOME/upstream/$1" checkout -q FETCH_HEAD
          }
          fetch eclipse.platform.swt https://github.com/eclipse-platform/eclipse.platform.swt.git "$SWT_SHA"
          fetch eclipse.platform.ui https://github.com/eclipse-platform/eclipse.platform.ui.git "$UI_SHA"
      - run: SWT_REPO="$HOME/upstream/eclipse.platform.swt" UI_REPO="$HOME/upstream/eclipse.platform.ui" make gen-check

  # The Linux GUI stand (tooling/linux/Dockerfile): the gtk port under Xvfb. Each gate builds the image from the shared layer cache.
  linux-gates:
    name: linux ${{ matrix.gate }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # tests/expected_linux.txt: the translated SWT JUnit tests on the gtk port.
          - gate: swt tests
            cmd: >-
              go build -o /tmp/swttest ./cmd/swttest &&
              /tmp/swttest -expected tests/expected_linux.txt
          - gate: jface tests
            cmd: >-
              go build -tags jface -o /tmp/jfacetest ./cmd/swttest &&
              /tmp/jfacetest -expected tests/expected_jface_linux.txt
          # Unit tests (the one that needs a display, swt TestApplyAccent, runs against Xvfb).
          - gate: unit tests
            cmd: go test -v -count=1 ./...
          # Every package with GOWT_GUI_TEST tests (facade, look, icons, qa/qatest e2e, examples/qa, webview), one package at a time.
          - gate: gui tests
            cmd: GOWT_GUI_TEST=1 go test -v -count=1 -p 1 $(make -s check-gui-list)
          - gate: qa tree focus
            cmd: GOWT_GUI_TEST=1 go test -v -count=1 -tags gowtqa -run TestQATreeFocus .
          - gate: qa sidebar and inspector focus
            cmd: GOWT_GUI_TEST=1 go test -v -count=1 -tags gowtqa -run "^(TestSidebarFocus|TestInspectorFocus)$" ./look
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: tooling/linux
          tags: gowt-linux:ci
          load: true
          cache-from: type=gha,scope=gowt-linux
          cache-to: type=gha,scope=gowt-linux,mode=max
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/gowt-gocache
            ~/.cache/gowt-gomod
          key: linux-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            linux-go-${{ hashFiles('go.sum') }}-
      - name: Run the gate in the image
        # stand.sh starts Xvfb :99 first; the container runs as root, so the cache dirs are handed back afterwards.
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-logs
          mkdir -p ~/.cache/gowt-gocache ~/.cache/gowt-gomod
          docker run --rm -v "$PWD":/src -v ~/.cache/gowt-gocache:/gocache -v ~/.cache/gowt-gomod:/gomod \
            gowt-linux:ci stand.sh sh -c 'cd /src && go build -o /tmp/testexec ./tooling/testexec && export GOFLAGS="$GOFLAGS -exec=/tmp/testexec" GOWT_TRACE_LIFECYCLE=1 GOTRACEBACK=system && ${{ matrix.cmd }}' 2>&1 | tee test-logs/gate.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-logs-linux-${{ matrix.gate }}
          path: test-logs
          if-no-files-found: ignore
      - name: Return cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" ~/.cache/gowt-gocache ~/.cache/gowt-gomod

  # Developer Certificate of Origin: every commit of a pull request carries a Signed-off-by line (git commit -s).
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $c has no Signed-off-by line: $(git log -1 --format=%s "$c")"
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then
            echo "Add it with git commit -s, or git rebase --signoff $BASE for several commits. See CONTRIBUTING.md." >&2
            exit 1
          fi
