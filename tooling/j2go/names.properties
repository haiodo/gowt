# Hand-pinned Go names for erasureKey overload collisions goMemberName/resolveCrossFamilyNameCollisions
# can't resolve on their own. One entry per line: <declaringBinaryName>#<method>(<erasedParamTypes>)=<GoName>
#
# Button declares its own zero-arg createString() (renders the button's attributed title) that
# would otherwise shadow the promoted Control.createString(String,Font,double[],int,boolean,
# boolean,boolean) it also calls - Go has no overloading, so a directly-declared method always
# wins over a same-named promoted one regardless of arity, breaking every 7-arg call site.
org.eclipse.swt.widgets.Button#createString()=CreateAttributedTitle

# Canvas declares its own 5-arg public drawBackground(GC,x,y,w,h) that forwards to the promoted
# 7-arg Composite.drawBackground(GC,x,y,w,h,offsetX,offsetY) - same shadowing problem as above.
org.eclipse.swt.widgets.Canvas#drawBackground(org.eclipse.swt.graphics.GC,I,I,I,I)=DrawBackgroundGC

# Label declares its own zero-arg createString() (renders the label's attributed text), same
# shadowing problem as Button.createString() above.
org.eclipse.swt.widgets.Label#createString()=CreateAttributedText
