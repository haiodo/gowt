# javaMethodBaseName=C symbol override, for the rare native whose real symbol isn't its own Java
# name (see tooling/j2go/README.md "Native methods"). Every native otherwise binds to its literal
# Java name via purego.Dlsym(RTLD_DEFAULT, ...) lazily, on its own first call. Empty today: no
# occurrence of a method-level JNIGen `accessor=` Javadoc annotation exists in the translated set
# (checkpoint b's `@field accessor=`/`flags=const` occurrences are unrelated, see README); this
# file is where its result would go once a native needing it is translated.

# os.h's #define aliases: the typed JNI wrappers all resolve to the one objc runtime entry point
# (arm64 has no _fpret/_stret variants; _stret is handled by NativeEmitter.emitStretNative).
objc_msgSend_bool=objc_msgSend
objc_msgSendSuper_bool=objc_msgSendSuper
objc_msgSend_floatret=objc_msgSend
objc_msgSend_fpret=objc_msgSend
